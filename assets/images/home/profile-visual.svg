<svg xmlns="http://www.w3.org/2000/svg" width="760" height="840" viewBox="0 0 760 840" role="img" aria-labelledby="title desc">
  <title id="title">Abstract professional profile visual</title>
  <desc id="desc">A blue editorial illustration with the initials GP and geometric product design motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#d7eaff"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0067d2"/>
      <stop offset="1" stop-color="#2b83e2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#10233f" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="760" height="840" fill="url(#bg)"/>
  <circle cx="622" cy="126" r="154" fill="#c6e1ff" opacity="0.72"/>
  <circle cx="124" cy="728" r="180" fill="#ffffff" opacity="0.62"/>
