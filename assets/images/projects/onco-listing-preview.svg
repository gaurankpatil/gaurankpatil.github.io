    <text x="700" y="372">Diagnosis</text>
    <text x="970" y="372">Stage</text>
    <text x="1160" y="372">Status</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#10233f">
    <g transform="translate(0 0)">
      <rect x="280" y="392" width="1180" height="76" fill="#ffffff"/>
      <text x="310" y="438">C-1024</text><text x="480" y="438">Patient A</text><text x="700" y="438">Oncology case</text><text x="970" y="438">Stage II</text>
      <rect x="1150" y="411" width="118" height="36" rx="18" fill="#e8f8ef"/><text x="1180" y="437" fill="#0b8f65" font-weight="800">Active</text>
    </g>
    <g transform="translate(0 78)">
      <rect x="280" y="392" width="1180" height="76" fill="#f8faf9"/>
      <text x="310" y="438">C-1025</text><text x="480" y="438">Patient B</text><text x="700" y="438">Oncology case</text><text x="970" y="438">Stage I</text>
      <rect x="1150" y="411" width="150" height="36" rx="18" fill="#fff7e8"/><text x="1172" y="437" fill="#ae6500" font-weight="800">Pending</text>
    </g>
    <g transform="translate(0 156)">
      <rect x="280" y="392" width="1180" height="76" fill="#ffffff"/>
      <text x="310" y="438">C-1026</text><text x="480" y="438">Patient C</text><text x="700" y="438">Oncology case</text><text x="970" y="438">Stage III</text>
