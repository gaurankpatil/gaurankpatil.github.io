  <rect x="280" y="190" width="1180" height="62" rx="12" fill="#f5f8f6" stroke="#d8e5df"/>
  <text x="310" y="230" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#718096">Search by patient or case number</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">
