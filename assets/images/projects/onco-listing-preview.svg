<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic oncology case-listing preview</title>
  <desc id="desc">A privacy-safe visual placeholder representing a clinical case-management screen.</desc>
  <rect width="1600" height="900" fill="#f2f7f4"/>
  <rect x="0" y="0" width="190" height="900" fill="#2fb294"/>
  <circle cx="95" cy="85" r="42" fill="#ffffff" opacity="0.92"/>
  <path d="M68 84h54M95 57v54" stroke="#2fb294" stroke-width="7" stroke-linecap="round"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#ffffff" font-size="20" font-weight="700">
    <text x="42" y="235">Dashboard</text>
    <text x="42" y="350">Cases</text>
    <text x="42" y="465">Schedule</text>
    <text x="42" y="580">Reports</text>
  </g>
  <rect x="230" y="78" width="1310" height="742" rx="24" fill="#ffffff" stroke="#d8e5df" stroke-width="2"/>
