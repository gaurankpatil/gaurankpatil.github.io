    <text x="430" y="315" fill="#53657a">Active</text>
    <text x="540" y="315" fill="#53657a">Pending approval</text>
    <text x="760" y="315" fill="#53657a">Transferred</text>
    <text x="930" y="315" fill="#53657a">Archived</text>
  </g>
  <rect x="280" y="336" width="1180" height="56" fill="#dff3ed"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#53657a">
