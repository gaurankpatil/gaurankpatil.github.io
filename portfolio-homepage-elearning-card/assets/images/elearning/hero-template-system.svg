<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic compliance-learning template system</title>
  <desc id="desc">A light course template, dark course template, and interaction template arranged as a portfolio hero composition.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#d8eaff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#10233f" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" rx="36" fill="url(#bg)"/>
  <circle cx="1350" cy="130" r="210" fill="#0067d2" opacity=".08"/>
  <circle cx="190" cy="860" r="250" fill="#f28b3c" opacity=".10"/>

