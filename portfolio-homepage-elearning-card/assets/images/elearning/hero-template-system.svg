    <rect width="930" height="590" rx="26" fill="#fff"/>
    <rect width="930" height="56" rx="26" fill="#07172f"/>
    <circle cx="34" cy="28" r="7" fill="#ff7b73"/>
    <circle cx="57" cy="28" r="7" fill="#ffd36a"/>
    <circle cx="80" cy="28" r="7" fill="#6fd79a"/>
    <rect x="40" y="86" width="178" height="18" rx="9" fill="#0067d2" opacity=".18"/>
    <rect x="40" y="120" width="520" height="34" rx="8" fill="#07172f"/>
    <rect x="40" y="175" width="485" height="14" rx="7" fill="#9aabc0"/>
