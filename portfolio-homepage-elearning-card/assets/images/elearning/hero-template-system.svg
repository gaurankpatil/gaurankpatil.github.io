    <rect x="565" y="252" width="325" height="245" rx="18" fill="#0067d2"/>
    <circle cx="727" cy="355" r="68" fill="#fff" opacity=".22"/>
    <rect x="625" y="444" width="204" height="20" rx="10" fill="#fff" opacity=".9"/>
    <rect x="40" y="530" width="118" height="20" rx="10" fill="#0067d2"/>
    <rect x="742" y="530" width="148" height="20" rx="10" fill="#f28b3c"/>
    <text x="40" y="575" font-family="Inter, Arial" font-size="17" fill="#53657a">Course • Section • 4 of 7</text>
  </g>

