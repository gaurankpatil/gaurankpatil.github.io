      <rect x="380" width="165" height="170" rx="16" fill="#10233f" stroke="#2b405e"/>
      <circle cx="82" cy="48" r="22" fill="#0067d2"/>
      <circle cx="272" cy="48" r="22" fill="#f28b3c"/>
