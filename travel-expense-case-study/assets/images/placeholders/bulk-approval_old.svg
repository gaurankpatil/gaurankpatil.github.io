<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Bulk approval placeholder</title>
  <desc id="desc">A page-level selection flow with eligible reports, an excluded policy breach, and an approval confirmation.</desc>
  <rect width="1200" height="900" fill="#f2f7fd"/>
  <text x="80" y="100" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0d2340">Guarded page-level bulk approval</text>
  <text x="80" y="145" font-family="Arial, sans-serif" font-size="19" fill="#5d7086">Efficiency for routine work without bypassing policy review</text>

  <g transform="translate(70 215)">
    <rect width="670" height="510" rx="26" fill="#ffffff" stroke="#d5e1ed" stroke-width="2"/>
    <rect x="0" y="0" width="670" height="74" rx="26" fill="#f8fafc"/>
    <rect x="32" y="26" width="20" height="20" rx="4" fill="#0067d2"/>
    <path d="M37 36l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="43" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172a45">Select all eligible reports on this page</text>
    <rect x="475" y="18" width="165" height="40" rx="12" fill="#0067d2"/>
    <text x="557" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Bulk approve</text>

    <g font-family="Arial, sans-serif" font-size="16">
      <g transform="translate(30 105)">
        <rect width="610" height="76" rx="14" fill="#f8fbff" stroke="#dce8f4"/>
        <rect x="20" y="28" width="20" height="20" rx="4" fill="#0067d2"/>
        <path d="M25 38l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="64" y="34" font-weight="700" fill="#172a45">Team travel · Rahul Mehta</text>
        <text x="64" y="58" fill="#63758a">0–7 days · compliant</text>
        <text x="560" y="45" text-anchor="end" font-weight="700" fill="#172a45">INR 18,500</text>
      </g>
      <g transform="translate(30 195)">
        <rect width="610" height="76" rx="14" fill="#f8fbff" stroke="#dce8f4"/>
        <rect x="20" y="28" width="20" height="20" rx="4" fill="#0067d2"/>
        <path d="M25 38l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="64" y="34" font-weight="700" fill="#172a45">Product conference · Anita Desai</text>
        <text x="64" y="58" fill="#63758a">8–14 days · compliant</text>
        <text x="560" y="45" text-anchor="end" font-weight="700" fill="#172a45">USD 650</text>
      </g>
      <g transform="translate(30 285)">
        <rect width="610" height="90" rx="14" fill="#fff3f3" stroke="#efc9c9"/>
        <rect x="20" y="35" width="20" height="20" rx="4" fill="#eef1f5" stroke="#aab8c8"/>
        <text x="64" y="36" font-weight="700" fill="#172a45">Client meeting · Priya Sharma</text>
        <text x="64" y="62" fill="#c43d3d">Policy breach · individual review required</text>
        <text x="560" y="50" text-anchor="end" font-weight="700" fill="#172a45">SGD 1,240</text>
      </g>
    </g>
    <text x="32" y="458" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0067d2">2 eligible reports selected</text>
    <text x="32" y="486" font-family="Arial, sans-serif" font-size="14" fill="#63758a">1 report excluded because it requires individual policy review.</text>
  </g>

  <g transform="translate(785 290)" font-family="Arial, sans-serif">
    <rect width="345" height="340" rx="24" fill="#ffffff" stroke="#d5e1ed" stroke-width="2"/>
    <circle cx="173" cy="62" r="30" fill="#eef6ff"/>
    <path d="M160 62l9 9 18-21" fill="none" stroke="#0067d2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="173" y="125" text-anchor="middle" font-size="25" font-weight="700" fill="#0d2340">Approve 2 reports?</text>
    <text x="173" y="165" text-anchor="middle" font-size="16" fill="#63758a">This action applies only to eligible</text>
    <text x="173" y="190" text-anchor="middle" font-size="16" fill="#63758a">reports selected on the current page.</text>
    <rect x="36" y="238" width="126" height="50" rx="13" fill="#ffffff" stroke="#cfdbe7"/>
    <text x="99" y="269" text-anchor="middle" font-size="17" font-weight="700" fill="#53657a">Cancel</text>
    <rect x="183" y="238" width="126" height="50" rx="13" fill="#0067d2"/>
    <text x="246" y="269" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Confirm</text>
  </g>

  <path d="M750 455h34" stroke="#0067d2" stroke-width="5" stroke-linecap="round"/>
  <path d="M773 443l12 12-12 12" fill="none" stroke="#0067d2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
